# ============================================================
# Ingress compartido — expone los microservicios publicamente.
# ------------------------------------------------------------
# HTTPS: cert-manager + Let's Encrypt emiten el cert para el host
#   clinica-937b0859.northcentralus.cloudapp.azure.com  (secret clinica-tls).
# Cada Ingress tiene 2 reglas con los MISMOS paths:
#   - con host=FQDN  -> nginx sirve el cert valido (HTTPS con candado).
#   - sin host       -> catch-all para el acceso por IP (http://<IP>, y el APK movil).
# ssl-redirect=false: no forzamos https, para no romper el HTTP por IP ni el movil.
#
# Ruteo:
#   /api/*        -> ms-ms-pacientes-nextjs:3000  (BFF; conserva /api)
#   / (raiz)      -> frontend-web:80               (SPA Angular)
#   /gestion/*    -> ms-springboot-gestion:8080    (se quita /gestion)
#   /ia/*         -> ms-diagnostico-ia:8000         (se quita /ia)
#   /blockchain/* -> ms-blockchain:3001             (se quita /blockchain)
# ============================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinica-ingress-api
  namespace: clinica
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - clinica-937b0859.northcentralus.cloudapp.azure.com
      secretName: clinica-tls
  rules:
    - host: clinica-937b0859.northcentralus.cloudapp.azure.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ms-ms-pacientes-nextjs
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-web
                port:
                  number: 80
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ms-ms-pacientes-nextjs
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinica-ingress-services
  namespace: clinica
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - clinica-937b0859.northcentralus.cloudapp.azure.com
      secretName: clinica-tls
  rules:
    - host: clinica-937b0859.northcentralus.cloudapp.azure.com
      http:
        paths:
          - path: /gestion(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-springboot-gestion
                port:
                  number: 8080
          - path: /ia(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-diagnostico-ia
                port:
                  number: 8000
          - path: /blockchain(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-blockchain
                port:
                  number: 3001
    - http:
        paths:
          - path: /gestion(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-springboot-gestion
                port:
                  number: 8080
          - path: /ia(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-diagnostico-ia
                port:
                  number: 8000
          - path: /blockchain(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ms-blockchain
                port:
                  number: 3001
