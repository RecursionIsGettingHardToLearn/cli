---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evolution-pgdata-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-postgres
  labels:
    app: evolution-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evolution-postgres
  template:
    metadata:
      labels:
        app: evolution-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "evolution"
            - name: POSTGRES_PASSWORD
              value: "evolution"
            - name: POSTGRES_DB
              value: "evolution"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: evolution-pgdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: evolution-postgres
spec:
  selector:
    app: evolution-postgres
  ports:
    - port: 5432
      targetPort: 5432
