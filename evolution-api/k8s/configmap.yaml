apiVersion: v1
kind: ConfigMap
metadata:
  name: evolution-api-config
data:
  AUTHENTICATION_TYPE: "apikey"
  AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

  # Base de datos (obligatoria en v2)
  DATABASE_ENABLED: "true"
  DATABASE_PROVIDER: "postgresql"
  DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public"
  DATABASE_CONNECTION_CLIENT_NAME: "evolution_clinica"
  DATABASE_SAVE_DATA_INSTANCE: "true"
  DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
  DATABASE_SAVE_MESSAGE_UPDATE: "false"
  DATABASE_SAVE_DATA_CONTACTS: "false"
  DATABASE_SAVE_DATA_CHATS: "false"
  DATABASE_SAVE_DATA_LABELS: "false"
  DATABASE_SAVE_DATA_HISTORIC: "false"

  # Cache local (sin Redis)
  CACHE_REDIS_ENABLED: "false"
  CACHE_LOCAL_ENABLED: "true"

  # Webhooks y WebSocket
  WEBHOOK_GLOBAL_ENABLED: "true"
  WEBSOCKET_ENABLED: "true"
  WEBSOCKET_GLOBAL_EVENTS: "true"

  # Servidor
  SERVER_URL: "https://clinica-937b0859.northcentralus.cloudapp.azure.com/evolution"
  DEL_INSTANCE: "false"
  LANGUAGE: "es"
  CONFIG_SESSION_PHONE_CLIENT: "Clinica"

  # Logs
  LOG_LEVEL: "ERROR"
  LOG_COLOR: "true"
